<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customer Feedback</title>
  <style>
    body, html {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100%;
    }

    .hero {
      background: url('images/a.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .feedback-container {
      width: 90%;
      max-width: 600px;
      padding: 60px;
      background-color: rgba(255, 255, 255, 0.564);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      border-radius: 200px;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    .feedback-container input,
    .feedback-container textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #e8e2e225;
      border-radius: 5px;
      font-size: 14px;
    }

    .feedback-container input[type="submit"] {
      background-color: #f0c040;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .feedback-container input[type="submit"]:hover {
      background-color: #d9a630;
    }

    .rating {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .rating input {
      display: none;
    }

    .rating label {
      font-size: 30px;
      color: #ccc;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .rating input:checked ~ label,
    .rating label:hover,
    .rating label:hover ~ label {
      color: #f0c040;
    }

    /* Make stars highlight properly on hover */
    .rating label:hover,
    .rating input:checked ~ label {
      color: #f0c040;
    }

    /* Ensures all previous stars highlight when selected */
    .rating input:checked ~ label,
    .rating input:checked + label,
    .rating input:checked + label ~ label {
      color: #f0c040;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="feedback-container">
      <h2>Customer Feedback</h2>
      <form action="submit_feedback.php" method="POST">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="Your full name">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="Your email address">

        <label>Rate Your Experience</label>
        <div class="rating">
          <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
          <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
          <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
          <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
          <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
        </div>

        <label for="feedback">Your Feedback</label>
        <textarea id="feedback" name="feedback" rows="5" required placeholder="Write your feedback here..."></textarea>

        <input type="submit" value="Submit Feedback">
      </form>
    </div>
  </div>
</body>
</html>
