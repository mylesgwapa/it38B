<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>POS Admin Panel</title>
  <link rel="stylesheet" href="pos.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('images/a.png') no-repeat center center fixed;
      background-size: cover;
    }
    .admin-container {
      display: flex;
    }
    .sidebar {
      width: 220px;
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      min-height: 100vh;
      padding: 20px;
    }
    .sidebar h2 {
      text-align: center;
    }
    .sidebar ul {
      list-style: none;
      padding: 0;
    }
    .sidebar li {
      margin: 20px 0;
    }
    .sidebar a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    .main-content {
      flex-grow: 1;
      padding: 30px;
      background-color: rgba(255, 255, 255, 0.9);
    }
    form input, form button {
      display: block;
      margin: 10px 0;
      padding: 10px;
      width: 100%;
      max-width: 400px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
    }
    hr {
      margin: 40px 0;
    }
  </style>
</head>
<body>

    <div class="admin-container">
        <aside class="sidebar">
          <h2>POS INTEGRATION</h2>
          <nav>
            <ul>
              <li><a href="#addProduct">➕ Add Products</a></li>
              <li><a href="#viewOrders">📦 View Orders</a></li>
              <li><a href="#inventory">📊 Inventory Status</a></li>
            </ul>
          </nav>
        </aside>
    
        <main class="main-content">
          <section id="addProduct">
            <h2>Add New Product</h2>
            <form id="addProductForm">
              <input type="text" name="product_name" placeholder="Product Name" required />
              <input type="number" name="price" placeholder="Price" required />
              <input type="number" name="quantity" placeholder="Quantity" required />
              <input type="url" name="image_url" placeholder="Image URL" />
              <button type="submit">Add Product</button>
            </form>
          </section>
    
          <hr>
    
          <section id="viewOrders">
            <h2>Customer Orders</h2>
            <table>
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Name</th>
                  <th>Phone</th>
                  <th>Total</th>
                  <th>Delivery</th>
                  <th>Payment</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="ordersTableBody"></tbody>
            </table>
          </section>
    
          <hr>
    
          <section id="inventory">
            <h2>Inventory Status</h2>
            <table>
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Price</th>
                  <th>In Stock</th>
                  <th>Image</th>
                </tr>
              </thead>
              <tbody id="inventoryTableBody"></tbody>
            </table>
          </section>
        </main>
      </div>
    
      <script>
        // Add Product Form
        document.getElementById('addProductForm').onsubmit = function(e) {
          e.preventDefault();
          const form = e.target;
          const newProduct = {
            name: form.product_name.value,
            price: parseFloat(form.price.value),
            quantity: parseInt(form.quantity.value),
            image: form.image_url.value
          };
          const products = JSON.parse(localStorage.getItem('products')) || [];
          products.push(newProduct);
          localStorage.setItem('products', JSON.stringify(products));
          window.location.reload(); // Refresh to show inventory
        };
    
        // Inventory
        const products = JSON.parse(localStorage.getItem('products')) || [];
        const inventoryTable = document.getElementById('inventoryTableBody');
        inventoryTable.innerHTML = products.map(p => `
          <tr>
            <td>${p.name}</td>
            <td>₱${p.price}</td>
            <td>${p.quantity}</td>
            <td><img src="${p.image}" height="40"/></td>
          </tr>
        `).join('');
    
        // Orders
        const orders = JSON.parse(localStorage.getItem('orders')) || [];
        const ordersTable = document.getElementById('ordersTableBody');
        ordersTable.innerHTML = orders.length === 0
          ? '<tr><td colspan="7">No orders yet.</td></tr>'
          : orders.map(o => `
            <tr>
              <td>${o.id}</td>
              <td>${o.name}</td>
              <td>${o.phone}</td>
              <td>₱${o.total}</td>
              <td>${o.delivery}</td>
              <td>${o.payment}</td>
              <td>${o.date}</td>
            </tr>
          `).join('');
      </script>
    </body>
    </html>
