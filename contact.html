<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      color: #333;
      height: 100%;
    }

    .hero {
      background: url('images/a.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      min-height: 100vh;
      position: relative;
      color: white;
    }

    header {
      background-color: #333;
      padding: 1rem 2rem;
      display: flex;
      justify-content: flex-end;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 16px;
      padding: 8px 14px;
      border-radius: 6px;
      transition: background 0.3s;
    }

    nav a:hover {
      background-color: #555;
      color: #ffdd57;
    }

    .content {
      max-width: 800px;
      margin: 2rem auto;
      padding: 2rem;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      color: #333;
    }

    h1 {
      text-align: center;
      color: #222;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input, textarea {
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    button {
      padding: 0.8rem;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>

  <div class="hero">
  <div class="content">
    <a href="landingpage.html" style="display: inline-block; margin-bottom: 1rem; text-decoration: none; color: white; background-color: #333; padding: 10px 16px; border-radius: 6px;">← Back</a>
 
      <h1>Contact Us</h1>
      <form action="send_email.php" method="post">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>

</body>
</html>
